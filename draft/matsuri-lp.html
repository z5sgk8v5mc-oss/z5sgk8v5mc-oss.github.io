<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知られざる日本の奇祭図鑑</title>
  <style>
    :root {
      --red: #c0392b; --dark-red: #922b21; --gold: #d4a017;
      --dark: #1a1a1a; --darker: #111; --card-bg: #1e1e1e;
      --text: #f0e6d3; --muted: #9e8c78; --border: #3a3020;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--darker); color: var(--text); font-family: 'Hiragino Mincho ProN','Yu Mincho',serif; line-height: 1.8; }

    /* ── HERO ── */
    .hero { position:relative; text-align:center; padding:80px 20px 60px; background:linear-gradient(180deg,#0a0000 0%,#1a0505 60%,var(--darker) 100%); overflow:hidden; }
    .hero::before { content:'🔥'; position:absolute; font-size:400px; opacity:.04; top:-80px; left:50%; transform:translateX(-50%); pointer-events:none; }
    .hero-kamon { font-size:52px; margin-bottom:16px; animation:float 4s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .hero h1 { font-size:clamp(1.8rem,5vw,3.2rem); letter-spacing:.15em; color:var(--gold); text-shadow:0 0 40px rgba(212,160,23,.4); margin-bottom:12px; }
    .hero-sub { font-size:.98rem; color:var(--muted); letter-spacing:.06em; max-width:560px; margin:0 auto 28px; }
    .hero-badges { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
    .badge { background:rgba(192,57,43,.15); border:1px solid rgba(192,57,43,.4); color:#e8a09a; padding:5px 14px; border-radius:20px; font-size:.82rem; }

    /* ── STATS ── */
    .stats { display:flex; justify-content:center; border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:#150f00; }
    .stat-item { flex:1; max-width:180px; text-align:center; padding:20px 12px; border-right:1px solid var(--border); }
    .stat-item:last-child { border-right:none; }
    .stat-num { font-size:1.8rem; color:var(--gold); display:block; line-height:1; margin-bottom:4px; }
    .stat-label { font-size:.72rem; color:var(--muted); letter-spacing:.06em; }

    /* ── TABS ── */
    .tabs { display:flex; background:var(--dark); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; }
    .tab-btn { flex:1; padding:16px; background:none; border:none; color:var(--muted); font-family:inherit; font-size:.95rem; letter-spacing:.06em; cursor:pointer; border-bottom:3px solid transparent; transition:all .2s; }
    .tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); background:rgba(212,160,23,.05); }
    .tab-btn:hover:not(.active) { color:var(--text); background:rgba(255,255,255,.03); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    /* ── FILTER ── */
    .filter-bar { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:24px 20px; background:var(--dark); }
    .filter-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:7px 18px; border-radius:24px; cursor:pointer; font-family:inherit; font-size:.88rem; letter-spacing:.04em; transition:all .2s; }
    .filter-btn:hover, .filter-btn.active { background:var(--red); border-color:var(--red); color:#fff; }

    /* ── GRID ── */
    .section-title { text-align:center; padding:10px 20px 0; font-size:.78rem; letter-spacing:.12em; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1px; background:var(--border); margin:16px 0; }
    .card { background:var(--card-bg); padding:28px 24px; cursor:pointer; transition:background .2s; display:flex; flex-direction:column; gap:10px; position:relative; }
    .card:hover { background:#262626; }
    .card-top-row { display:flex; justify-content:space-between; align-items:flex-start; }
    .card-season { font-size:.75rem; color:var(--muted); letter-spacing:.06em; }
    .fav-btn { background:none; border:none; cursor:pointer; font-size:1.3rem; line-height:1; padding:2px; transition:transform .15s; }
    .fav-btn:hover { transform:scale(1.2); }
    .fav-btn.active { filter:drop-shadow(0 0 4px #e74c3c); }
    .card-icon { font-size:2rem; }
    .card-pref { font-size:.76rem; color:var(--red); letter-spacing:.08em; }
    .card h2 { font-size:1.3rem; color:var(--gold); letter-spacing:.05em; line-height:1.4; }
    .card-tags { display:flex; gap:5px; flex-wrap:wrap; }
    .tag { font-size:.7rem; border:1px solid var(--border); color:var(--muted); padding:2px 9px; border-radius:12px; }
    .card-desc { font-size:.88rem; color:#c8b89a; line-height:1.9; }
    .card-unique { font-size:.83rem; color:#e8a09a; background:rgba(192,57,43,.08); border-left:3px solid var(--red); padding:9px 13px; border-radius:0 6px 6px 0; line-height:1.8; }
    .card-meta { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:10px; font-size:.76rem; color:var(--muted); flex-wrap:wrap; gap:4px; }
    .card-designation { background:rgba(212,160,23,.1); border:1px solid rgba(212,160,23,.3); color:#d4a017; padding:2px 9px; border-radius:10px; font-size:.7rem; }
    .card-official-badge { font-size:.7rem; background:rgba(212,160,23,.12); border:1px solid rgba(212,160,23,.3); color:var(--gold); padding:2px 8px; border-radius:10px; }

    /* ── MAP ── */
    .map-container { padding:24px 20px; }
    .map-wrapper { position:relative; max-width:700px; margin:0 auto; }
    .map-wrapper svg { width:100%; height:auto; display:block; }
    .map-pin { cursor:pointer; transition:transform .15s; transform-origin:center; }
    .map-pin:hover .pin-circle { r:11; }
    .map-tooltip { position:absolute; background:#1e1a14; border:1px solid var(--border); border-radius:8px; padding:12px 16px; pointer-events:none; opacity:0; transition:opacity .15s; min-width:180px; z-index:10; }
    .map-tooltip.show { opacity:1; }
    .map-tooltip h4 { color:var(--gold); font-size:.95rem; margin-bottom:4px; }
    .map-tooltip p { color:var(--muted); font-size:.78rem; }
    .map-legend { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
    .map-legend-item { display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--muted); }
    .legend-dot { width:12px; height:12px; border-radius:50%; }

    /* ── MYPAGE ── */
    .mypage { padding:32px 20px; max-width:900px; margin:0 auto; }
    .mypage-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
    .mypage-header h2 { font-size:1.4rem; color:var(--gold); letter-spacing:.1em; }
    .mypage-count { font-size:.85rem; color:var(--muted); }
    .mypage-empty { text-align:center; padding:80px 20px; color:var(--muted); }
    .mypage-empty .empty-icon { font-size:4rem; margin-bottom:16px; }
    .mypage-empty p { font-size:.95rem; line-height:2; }
    .mypage-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .mypage-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:20px; display:flex; flex-direction:column; gap:8px; cursor:pointer; transition:border-color .2s; }
    .mypage-card:hover { border-color:var(--gold); }
    .mypage-card-top { display:flex; justify-content:space-between; align-items:center; }
    .mypage-card h3 { font-size:1.1rem; color:var(--gold); letter-spacing:.04em; }
    .mypage-card .card-pref { font-size:.75rem; }
    .mypage-card .card-desc { font-size:.83rem; }
    .clear-btn { background:rgba(192,57,43,.15); border:1px solid rgba(192,57,43,.35); color:#e8a09a; padding:7px 16px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:.82rem; }
    .clear-btn:hover { background:rgba(192,57,43,.3); }
    .season-section { margin-bottom:28px; }
    .season-section h3 { font-size:.85rem; letter-spacing:.1em; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:16px; }

    /* ── MODAL ── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.open { display:flex; }
    .modal { background:#1e1a14; border:1px solid var(--border); border-radius:12px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto; padding:36px 32px; position:relative; }
    .modal-close { position:absolute; top:14px; right:18px; background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer; }
    .modal-fav { position:absolute; top:14px; right:50px; background:none; border:none; font-size:1.5rem; cursor:pointer; transition:transform .15s; }
    .modal-fav:hover { transform:scale(1.2); }
    .modal h2 { color:var(--gold); font-size:1.7rem; margin-bottom:6px; }
    .modal-pref { color:var(--red); font-size:.88rem; margin-bottom:16px; }
    .modal-info-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .modal-info-item { background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:9px 14px; font-size:.8rem; }
    .modal-info-item span { color:var(--muted); display:block; font-size:.7rem; margin-bottom:2px; }
    .modal-body p { margin-bottom:14px; color:#c8b89a; font-size:.93rem; line-height:2; }
    .unique-box { background:rgba(192,57,43,.1); border:1px solid rgba(192,57,43,.3); border-radius:8px; padding:14px 18px; color:#e8a09a; margin-bottom:14px; font-size:.88rem; line-height:1.9; }
    .unique-box::before { content:'★ なぜ珍しい？'; display:block; font-size:.72rem; color:var(--red); letter-spacing:.08em; margin-bottom:6px; }
    .official-link { display:inline-flex; align-items:center; gap:8px; margin-top:14px; background:rgba(212,160,23,.1); border:1px solid rgba(212,160,23,.35); color:var(--gold); padding:9px 18px; border-radius:8px; text-decoration:none; font-size:.86rem; letter-spacing:.04em; transition:background .2s; }
    .official-link:hover { background:rgba(212,160,23,.22); }

    @media(max-width:600px){
      .stats{flex-wrap:wrap} .stat-item{min-width:100px}
      .grid,.mypage-grid{grid-template-columns:1fr}
      .modal{padding:24px 18px}
      .tabs .tab-btn{font-size:.8rem;padding:14px 8px}
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-kamon">⛩</div>
  <h1>知られざる日本の奇祭図鑑</h1>
  <p class="hero-sub">テレビでは見られない、ガイドブックには載らない。<br>日本の片隅で、今も静かに息づく奇妙で愛おしい祭りたち。</p>
  <div class="hero-badges">
    <span class="badge">🪔 全国12祭り収録</span>
    <span class="badge">🏛 国指定文化財あり</span>

  </div>
</section>

<div class="stats">

  <div class="stat-item"><span class="stat-num">11</span><span class="stat-label">都道府県</span></div>
  <div class="stat-item"><span class="stat-num">500+</span><span class="stat-label">年の歴史（最長）</span></div>
  <div class="stat-item"><span class="stat-num" id="favCount">0</span><span class="stat-label">お気に入り</span></div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('list',this)">📋 祭り一覧</button>
  <button class="tab-btn" onclick="switchTab('map',this)">🗾 地図で見る</button>
  <button class="tab-btn" onclick="switchTab('mypage',this)">❤️ マイページ</button>
</div>

<!-- TAB: LIST -->
<div class="tab-panel active" id="tab-list">
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filter('all',this)">すべて</button>
    <button class="filter-btn" onclick="filter('春',this)">🌸 春</button>
    <button class="filter-btn" onclick="filter('夏',this)">☀️ 夏</button>
    <button class="filter-btn" onclick="filter('秋',this)">🍂 秋</button>
    <button class="filter-btn" onclick="filter('冬',this)">❄️ 冬</button>
    <button class="filter-btn" onclick="filter('泥・砂',this)">💧 泥・砂系</button>
    <button class="filter-btn" onclick="filter('火',this)">🔥 火系</button>
    <button class="filter-btn" onclick="filter('謎',this)">❓ 謎系</button>
  </div>
  <p class="section-title">▼ カードをクリックすると詳細 / ♡ でお気に入り登録</p>
  <div class="grid" id="grid"></div>
</div>

</div>

// ─── STATE ───
const seasonColor = { 春:'#8bc34a', 夏:'#7ec8e3', 秋:'#d4a017', 冬:'#e8a09a' };
let currentModalId = null;

// ─── FAVORITES ───
function getFavs() { return JSON.parse(localStorage.getItem('matsuri-favs') || '[]'); }
function saveFavs(a) { localStorage.setItem('matsuri-favs', JSON.stringify(a)); }
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
  let favs = getFavs();
  if(favs.includes(id)) favs = favs.filter(x=>x!==id);
  else favs.push(id);
  saveFavs(favs);
  updateFavUI();
}
function updateFavUI() {
  const favs = getFavs();
  document.getElementById('favCount').textContent = favs.length;
  document.querySelectorAll('.fav-btn').forEach(btn => {
    const id = parseInt(btn.dataset.id);
    btn.textContent = isFav(id) ? '❤️' : '🤍';
    btn.classList.toggle('active', isFav(id));
  });
  if(currentModalId) {
    const btn = document.getElementById('modalFavBtn');
    btn.textContent = isFav(currentModalId) ? '❤️' : '🤍';
  }
  renderMypage();
  renderPins();
}
function toggleFavFromModal() { if(currentModalId) toggleFav(currentModalId); }
function clearFavs() {
  if(confirm('お気に入りをすべて削除しますか？')) { saveFavs([]); updateFavUI(); }
}

// ─── CARDS ───
function renderCards(list) {
  document.getElementById('grid').innerHTML = list.map(f => `
    <div class="card" onclick="openModal(${f.id})">
      <div class="card-top-row">
        <span class="card-season">${seasonColor[f.season] ? '●' : ''} ${f.season} / ${f.month}月</span>
        <button class="fav-btn ${isFav(f.id)?'active':''}" data-id="${f.id}"
          onclick="event.stopPropagation();toggleFav(${f.id})"
          title="お気に入りに追加">${isFav(f.id)?'❤️':'🤍'}</button>
      </div>
      <div class="card-icon">${f.icon}</div>
      <div class="card-pref">📍 ${f.pref}</div>
      <h2>${f.name}</h2>
      <div class="card-tags">${f.tags.map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
      <p class="card-desc">${f.desc.slice(0,85)}…</p>
      <div class="card-unique">${f.unique.slice(0,65)}…</div>
      <div class="card-meta">
        <span>${f.timing}</span>
        <span style="display:flex;gap:4px;flex-wrap:wrap">
          ${f.designation!=='なし'&&f.designation!=='地域の民俗行事'&&f.designation!=='市指定外'
            ? '<span class="card-designation">'+f.designation.slice(0,10)+'…</span>' : ''}
          ${f.url ? '<span class="card-official-badge">🔗 公式あり</span>' : ''}
        </span>
      </div>
    </div>`).join('');
}

function filter(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const list = cat==='all' ? festivals : festivals.filter(f=>f.season===cat||f.categories.includes(cat));
  renderCards(list);
}

// ─── MAP PINS ───
function renderPins() {
  const g = document.getElementById('pins');
  if(!g) return;
  g.innerHTML = festivals.map(f => {
    const col = seasonColor[f.season];
    const faved = isFav(f.id);
    return '<g class="map-pin" data-id="'+f.id+'"'
      +' onmouseenter="showTooltip(event,'+f.id+')"'
      +' onmouseleave="hideTooltip()"'
      +' onclick="openModal('+f.id+')">'
      +(faved ? '<circle cx="'+f.mapX+'" cy="'+f.mapY+'" r="14" fill="'+col+'" opacity="0.25"/>' : '')
      +'<circle class="pin-circle" cx="'+f.mapX+'" cy="'+f.mapY+'" r="8" fill="'+col+'" stroke="#1a1a1a" stroke-width="1.5"/>'
      +'<circle cx="'+f.mapX+'" cy="'+f.mapY+'" r="3" fill="#1a1a1a"/>'
      +(faved ? '<text x="'+(f.mapX+10)+'" y="'+(f.mapY-8)+'" font-size="10" fill="#e74c3c">❤</text>' : '')
      +'</g>';
  }).join('');
}

function showTooltip(e, id) {
  const f = festivals.find(x=>x.id===id);
  const tt = document.getElementById('mapTooltip');
  document.getElementById('ttName').textContent = f.icon+' '+f.name;
  document.getElementById('ttPref').textContent = '📍 '+f.pref;
  document.getElementById('ttTiming').textContent = '🗓 '+f.timing;
  const svgRect = document.getElementById('japanMap').getBoundingClientRect();
  const wRect = document.querySelector('.map-wrapper').getBoundingClientRect();
  const scaleX = svgRect.width / 600;
  const scaleY = svgRect.height / 680;
  let tx = (f.mapX * scaleX) + (svgRect.left - wRect.left) + 14;
  let ty = (f.mapY * scaleY) + (svgRect.top - wRect.top) - 20;
  if(tx + 200 > wRect.width) tx -= 210;
  tt.style.left = tx+'px';
  tt.style.top = ty+'px';
  tt.classList.add('show');
}
function hideTooltip() { document.getElementById('mapTooltip').classList.remove('show'); }

// ─── MYPAGE ───
function renderMypage() {
  const favs = getFavs();
  const el = document.getElementById('mypageContent');
  document.getElementById('mypageCount').textContent = favs.length+'件 登録中';
  if(!favs.length) {
    el.innerHTML = '<div class="mypage-empty"><div class="empty-icon">🤍</div><p>お気に入りはまだありません。<br>祭りのカードの ♡ をタップして登録しましょう！</p></div>';
    return;
  }
  const favFestivals = festivals.filter(f=>favs.includes(f.id));
  let html = '';
  ['春','夏','秋','冬'].forEach(s => {
    const group = favFestivals.filter(f=>f.season===s);
    if(!group.length) return;
    const em = s==='春'?'🌸':s==='夏'?'☀️':s==='秋'?'🍂':'❄️';
    html += '<div class="season-section"><h3>'+em+' '+s+'のお祭り</h3><div class="mypage-grid">'
      + group.map(f =>
        '<div class="mypage-card" onclick="openModal('+f.id+')">'
        +'<div class="mypage-card-top"><span style="font-size:1.6rem">'+f.icon+'</span>'
        +'<button class="fav-btn active" data-id="'+f.id+'" onclick="event.stopPropagation();toggleFav('+f.id+')">❤️</button></div>'
        +'<h3>'+f.name+'</h3>'
        +'<div class="card-pref">📍 '+f.pref+'</div>'
        +'<p class="card-desc">'+f.desc.slice(0,70)+'…</p>'
        +'<div class="card-tags">'+f.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'
        +'</div>').join('')
      +'</div></div>';
  });
  el.innerHTML = html;
}

// ─── MODAL ───
function openModal(id) {
  const f = festivals.find(x=>x.id===id);
  currentModalId = id;
  document.getElementById('modalFavBtn').textContent = isFav(id)?'❤️':'🤍';
  const tagsHtml = f.tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  const officialHtml = f.url
    ? '<a class="official-link" href="'+f.url+'" target="_blank" rel="noopener noreferrer">🔗 '+f.urlLabel+' ↗</a>'
    : '';
  document.getElementById('modalBody').innerHTML =
    '<p style="font-size:.78rem;color:var(--muted);letter-spacing:.08em;margin-bottom:4px">'+f.season+' の祭り</p>'
    +'<h2>'+f.icon+' '+f.name+'</h2>'
    +'<p class="modal-pref">📍 '+f.pref+'</p>'
    +'<div class="modal-info-row">'
    +'<div class="modal-info-item"><span>開催時期</span>'+f.timing+'</div>'
    +'<div class="modal-info-item"><span>文化財指定</span>'+f.designation+'</div>'
    +'</div>'
    +'<div class="modal-body">'
    +'<p>'+f.desc+'</p>'
    +'<div class="unique-box">'+f.unique+'</div>'
    +'<div class="card-tags">'+tagsHtml+'</div>'
    +officialHtml
    +'</div>';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  currentModalId = null;
}
function handleModalClick(e) {
  if(e.target === document.getElementById('modal')) closeModal();
}

// ─── TABS ───
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name === 'mypage') renderMypage();
}

// ─── INIT ───
renderCards(festivals);
renderPins();
updateFavUI();
</script>
